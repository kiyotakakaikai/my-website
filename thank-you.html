    <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --black: #2a2f4a;
    --accent: #c0392b;
    --accent-hv: #a93226;
    --gray-500: #9ca3af;
    --gray-700: #4b5563;
    --border: #e5e7eb;
    --white: #ffffff;
    --r: 2px;
}
body {
    font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: #f9fafb;
    color: var(--black);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
a { color: inherit; text-decoration: none; }
.l-header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 5%;
}
.l-header__logo { display: flex; align-items: center; gap: 12px; }
.l-header__logo img { height: 40px; width: auto; }
.l-header__logo-name { font-size: 1.1rem; font-weight: 700; color: var(--black); }
.l-header__logo-en { font-size: 0.65rem; color: var(--gray-500); letter-spacing: 0.1em; }

.p-main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 5%;
}
.p-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 56px 48px;
    max-width: 560px;
    width: 100%;
    text-align: center;
}
.p-icon {
    width: 64px;
    height: 64px;
    background: #f0fdf4;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 2rem;
}
.p-title {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 16px;
    line-height: 1.4;
}
.p-desc {
    font-size: 0.9rem;
    color: var(--gray-700);
    line-height: 1.9;
    margin-bottom: 36px;
}
.p-links {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.p-btn {
    display: block;
    padding: 14px 24px;
    border-radius: var(--r);
    font-size: 0.9rem;
    font-weight: 700;
    transition: opacity 0.2s;
}
.p-btn:hover { opacity: 0.85; }
.p-btn--primary { background: var(--black); color: var(--white); }
.p-btn--line { background: #06c755; color: var(--white); }

.l-footer {
    padding: 24px 5%;
    text-align: center;
    font-size: 0.78rem;
    color: var(--gray-500);
    border-top: 1px solid var(--border);
    background: var(--white);
}
@media (max-width: 600px) {
    .p-card { padding: 40px 24px; }
}
    </style>
    <style>
/* ブランドロゴ（2026-10 採用） */
.l-header__logo { display: flex; align-items: center; }
.l-header__logo .l-header__brand { height: 36px; width: auto; display: block; }
.l-footer__brand { display: inline-block; margin-bottom: 24px; }
.l-footer__brand img { height: 32px; width: auto; display: block; }
@media (max-width: 768px) {
    .l-header__logo .l-header__brand { height: 26px; }
    .l-footer__brand img { height: 26px; }
}
    </style>
</head>
<body>

<header class="l-header">
    <a href="index.html" class="l-header__logo">
            <img src="images/brand/logo-header-color.svg" alt="株式会社上田" class="l-header__brand" width="238" height="36" loading="eager" fetchpriority="high">
        </a>
</header>

<main class="p-main">
    <div class="p-card">
        <div class="p-icon">✅</div>
        <h1 class="p-title">お問い合わせありがとうございます</h1>
        <p class="p-desc">
            内容を確認の上、担当者より<strong>2営業日以内</strong>にご連絡いたします。<br>
            お急ぎの場合は、お電話または公式LINEにてご連絡ください。
        </p>
        <div class="p-links">
            <a href="index.html" class="p-btn p-btn--primary">トップページへ戻る</a>
            <a href="https://page.line.me/ovt4298c" target="_blank" class="p-btn p-btn--line">💬 公式LINEで相談する</a>
        </div>
    </div>
</main>

<footer class="l-footer">
    <a href="index.html" class="l-footer__brand"><img src="images/brand/logo-header-white.svg" alt="株式会社上田" width="212" height="32" loading="lazy"></a>
    <p>&copy; 株式会社上田</p>
</footer>

<script src="/js/budoux-ja.js" defer></script>
</body>
</html>
